<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tienda Alondralu</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Tienda Alondralu: catálogo, compras y gestión de caja e inventario.">
  <meta name="theme-color" content="#0e6b4b">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script>
    try {
      var t = localStorage.getItem('alondralu.theme');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
  <noscript>Esta aplicación necesita JavaScript.</noscript>
</body>
</html>
