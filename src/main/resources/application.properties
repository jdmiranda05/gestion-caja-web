# Base de datos persistente de la aplicacion
spring.application.name=gestion-caja-web
server.port=${PORT:8080}
spring.datasource.url=jdbc:h2:file:./data/gestion-caja
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT de la aplicacion
app.jwt.secret=${JWT_SECRET:VGhpc0lzQVRlc3RPbmx5S2V5Rm9ySldUMjAyNlRlc3RpbmcxMjM0NQ==}
app.jwt.expiration-minutes=60

# Credenciales iniciales para personal en desarrollo local (gerente y admin)
app.seed.staff-password=${STAFF_PASSWORD:admin123}
# Solo desarrollo: reasigna esa contrasena a admin y gerente al arrancar (RESET_STAFF_PASSWORD=true)
app.seed.reset-staff-password=${RESET_STAFF_PASSWORD:false}

# Consola H2 para desarrollo local
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway: reconocer la base de datos existente
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1